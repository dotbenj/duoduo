services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    env_file:
      - dev.env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - dev.env
    environment:
      PORT: 3000
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin
    ports:
      - "${PORT:-3000}:3000"

volumes:
  mongo_data:

